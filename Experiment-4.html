<!DOCTYPE html>
<html>
<head>
    <title>ABES Student Login Portal</title>
</head>
<body>
    <h2>ABES Student Login Portal</h2>
    <form action="/login" method="post">
        <table>
            <tr>
                <td>Student ID:</td>
                <td><input type="text" name="student_id" required></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password" name="password" required></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Login">
                </td>
            </tr>
        </table>
    </form>
    <p>Forgot your password? <a href="/forgot">Click here</a>.</p>
</body>
</html>
